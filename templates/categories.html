{% extends "base.html" %}

{% block title %}Kateqoriyalar · STEP Blog{% endblock %}

{% block content %}
<section class="page-head">
    <h1>Kateqoriyalar</h1>
    <p>Postları mövzuya görə seç.</p>
</section>

<div class="category-grid">
    {% for category in categories %}
        <a class="category-card" href="{% url 'blog:category_detail' category.slug %}">
            <h2>{{ category.name }}</h2>
            <p>{{ category.description }}</p>
        </a>
    {% empty %}
        <p>Kateqoriya yoxdur.</p>
    {% endfor %}
</div>
{% endblock %}
